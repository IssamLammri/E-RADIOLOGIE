services:
  # --- PHP / Symfony ---
  php:
    build: ./backend
    container_name: eradio_php
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      - db

  # --- Nginx pour exposer l'API ---
  nginx:
    image: nginx:alpine
    container_name: eradio_nginx
    ports:
      - "8090:80"
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/public/uploads
      - ./backend/nginx:/etc/nginx/conf.d
    depends_on:
      - php

  # --- Base de données MySQL ---
  db:
    image: mysql:8.0
    container_name: eradio_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eradiologie
      MYSQL_USER: eradio_user
      MYSQL_PASSWORD: eradio_pass
    volumes:
      - db_data:/var/lib/mysql

  # --- phpMyAdmin (facultatif) ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: eradio_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8089:80"
    depends_on:
      - db

volumes:
  db_data:
  uploads_data:
